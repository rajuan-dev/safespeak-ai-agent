[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safespeak-ai-agent"
version = "0.1.0"
description = "SafeSpeak FastAPI service for legal RAG, AI orchestration, and PDF extraction."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "PyMuPDF>=1.25,<2",
  "pymongo>=4.11,<5",
  "pinecone>=7,<9",
  "openai>=2,<3",
  "langgraph>=1,<2",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=11,<13"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

